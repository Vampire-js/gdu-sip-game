<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b16" />
    <!-- iOS "Add to Home Screen" fullscreen support. Safari ignores the PWA
         manifest's `display` field, so these apple-mobile-web-app tags are
         what actually make it fullscreen there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIP" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>sip-game</title>
  </head>
  <body>
    <div class="canvas-wrapper">
    <style>
/* Base image */
canvas {
    filter:
        brightness(1.0)
        contrast(1.06)
        saturate(1.0);
}

/* Fullscreen grading layer */
.color-grade {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;

    background:
        linear-gradient(
            to bottom,
            #FFD080 0%,
            #F0A044 35%,
            #B66A32 65%,
            #70402A 85%,
            #3A2118 100%
        );

    mix-blend-mode: soft-light;
    opacity: 1.5;
}
      
    </style>
    <div id="hud" class="hud">
      <div><strong>WASD</strong> / arrows to drive &middot; <strong>space</strong> to brake &middot; <strong>R</strong> to reset</div>
      <div id="speed">0 km/h</div>
    </div>
    </div>
    <div class="color-grade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
