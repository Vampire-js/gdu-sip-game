<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b16" />
    <!-- iOS "Add to Home Screen" fullscreen support. Safari ignores the PWA
         manifest's `display` field, so these apple-mobile-web-app tags are
         what actually make it fullscreen there. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIP" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>sip-game</title>
  </head>
  <body>
    <style>
      canvas {
        /* Warm color grade via CSS filter — free (browser compositor).
           - sepia(0.25): stronger warm hue shift toward amber
           - hue-rotate(-8deg): push oranges/reds even warmer (golden hour)
           - saturate(1.3): recover punch (sepia desaturates, we compensate hard)
           - contrast(1.1): keep shadows deep so the warmth doesn't wash out */
        filter: sepia(0.25) hue-rotate(-8deg) saturate(1.3) contrast(1.1);
      }
    </style>
    <div id="hud" class="hud">
      <div><strong>WASD</strong> / arrows to drive &middot; <strong>space</strong> to brake &middot; <strong>R</strong> to reset</div>
      <div id="speed">0 km/h</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
